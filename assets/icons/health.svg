  </defs>
  <!-- Shield/Heart Base Shape -->
  <path d="M32 58 C16 46 8 36 8 22 C8 12 16 6 25 6 C29 6 32 9 32 9 C32 9 35 6 39 6 C48 6 56 12 56 22 C56 36 48 46 32 58 Z" fill="url(#healthGrad)" filter="url(#healthGlow)"/>
