<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="moonCrystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Shattered Lunar Crystal Cluster -->
  <g filter="url(#moonGlow)">
    <!-- Main Center Crystal -->
    <polygon points="32,6 44,22 38,54 26,54 20,22" fill="url(#moonCrystal)" stroke="#3b0764" stroke-width="1.5"/>
    <!-- Facet Highlight Lines -->
    <polygon points="32,6 38,24 32,54 26,54 26,24" fill="#e9d5ff" opacity="0.4"/>
    <line x1="32" y1="6" x2="32" y2="54" stroke="#f3e8ff" stroke-width="1.5"/>
    
    <!-- Left Crystal Spire -->
    <polygon points="18,20 24,30 18,48 10,44 12,28" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>
    <polygon points="18,20 18,48 10,44" fill="#d8b4fe" opacity="0.4"/>
    
    <!-- Right Crystal Spire -->
    <polygon points="46,18 54,26 50,46 42,48 40,28" fill="#6b21a8" stroke="#3b0764" stroke-width="1.5"/>
    <polygon points="46,18 50,46 54,26" fill="#c084fc" opacity="0.5"/>
  </g>
  <!-- Cosmic Star Sparkles -->
  <circle cx="22" cy="14" r="1.5" fill="#f5d0fe"/>
  <circle cx="48" cy="12" r="2" fill="#ffffff"/>
  <circle cx="54" cy="38" r="1.5" fill="#f5d0fe"/>
</svg>
