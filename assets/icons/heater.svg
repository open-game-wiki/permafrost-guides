<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="metalCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heatCoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="coilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Main Appliance Housing -->
  <rect x="12" y="14" width="40" height="42" rx="4" fill="url(#metalCase)" stroke="#0f172a" stroke-width="2"/>
  <!-- Base Stand Feet -->
  <rect x="14" y="56" width="8" height="4" rx="1" fill="#0f172a"/>
  <rect x="42" y="56" width="8" height="4" rx="1" fill="#0f172a"/>
  <!-- Front Grill Vents (Glowing Heating Elements) -->
  <rect x="18" y="22" width="28" height="26" rx="2" fill="#0f172a"/>
  <g filter="url(#coilGlow)" stroke="url(#heatCoil)" stroke-width="2.5" stroke-linecap="round">
    <line x1="22" y1="28" x2="42" y2="28"/>
    <line x1="22" y1="35" x2="42" y2="35"/>
    <line x1="22" y1="42" x2="42" y2="42"/>
  </g>
  <!-- Grill Mesh Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.6">
    <line x1="26" y1="24" x2="26" y2="46"/>
    <line x1="32" y1="24" x2="32" y2="46"/>
    <line x1="38" y1="24" x2="38" y2="46"/>
  </g>
  <!-- Control Knob & Indicator Light -->
  <circle cx="44" cy="18" r="2" fill="#ef4444"/>
  <circle cx="20" cy="18" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
</svg>
