<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Crossed Firewood Logs -->
  <g fill="url(#woodGrad)" stroke="#291102" stroke-width="1.5">
    <!-- Log 1 (Left to Right) -->
    <rect x="8" y="48" width="48" height="8" rx="3" transform="rotate(-15 32 52)"/>
    <!-- Log 2 (Right to Left) -->
    <rect x="8" y="48" width="48" height="8" rx="3" transform="rotate(15 32 52)"/>
  </g>
  <!-- Stones Ring Base -->
  <g fill="#475569" stroke="#1e293b" stroke-width="1">
    <ellipse cx="14" cy="54" rx="5" ry="3"/>
    <ellipse cx="24" cy="56" rx="6" ry="3.5"/>
    <ellipse cx="40" cy="56" rx="6" ry="3.5"/>
    <ellipse cx="50" cy="54" rx="5" ry="3"/>
  </g>
  <!-- Main Flame -->
  <path d="M32 6 C32 6 44 20 44 32 C44 42 38 48 32 48 C26 48 20 42 20 32 C20 20 32 6 32 6 Z" fill="url(#fireGrad)" filter="url(#fireGlow)"/>
  <!-- Inner Flame Tongue -->
  <path d="M32 18 C32 18 39 26 39 34 C39 40 36 44 32 44 C28 44 25 40 25 34 C25 26 32 18 32 18 Z" fill="#fef08a"/>
  <!-- Sparks -->
  <circle cx="28" cy="10" r="1.5" fill="#fef08a"/>
  <circle cx="36" cy="14" r="1" fill="#fde047"/>
</svg>
