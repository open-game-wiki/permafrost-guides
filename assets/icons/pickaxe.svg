<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="pickHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="pickGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Wooden Shaft Handle -->
  <line x1="16" y1="52" x2="42" y2="24" stroke="url(#handleGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Handle Grip Wrap -->
  <line x1="18" y1="50" x2="26" y2="41" stroke="#451a03" stroke-width="6" stroke-linecap="round"/>
  <!-- Curved Pickaxe Head -->
  <path d="M24 14 C36 18 44 26 52 38 C48 30 40 22 28 18 L24 14 Z" fill="url(#pickHead)" filter="url(#pickGlow)" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M46 8 C38 16 30 24 18 32 C26 24 34 16 42 8 L46 8 Z" fill="url(#pickHead)" filter="url(#pickGlow)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Metal Collar Connection -->
  <rect x="36" y="18" width="8" height="8" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" transform="rotate(45 40 22)"/>
  <!-- Pick Sharp Points -->
  <polygon points="52,38 54,42 48,39" fill="#f8fafc"/>
  <polygon points="46,8 49,5 44,9" fill="#f8fafc"/>
</svg>
