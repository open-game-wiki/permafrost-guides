<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="dogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Canine / Husky Head Profile -->
  <g filter="url(#dogGlow)">
    <!-- Ears -->
    <polygon points="18,6 26,24 12,22" fill="#78350f" stroke="#451a03" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="19,10 24,22 15,20" fill="#fde68a"/>
    <polygon points="40,8 48,24 34,22" fill="#92400e" stroke="#451a03" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="39,12 45,22 36,20" fill="#fde68a"/>
    
    <!-- Head Base -->
    <path d="M14 24 C14 24 28 18 42 24 C46 32 46 44 42 50 C36 56 22 56 16 50 C12 44 12 32 14 24 Z" fill="url(#dogGrad)" stroke="#451a03" stroke-width="1.5"/>
    
    <!-- Muzzle / Snout -->
    <path d="M40 32 L56 36 C58 39 56 44 52 45 L38 46 Z" fill="#fef3c7" stroke="#451a03" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Nose -->
    <ellipse cx="55" cy="38" rx="3" ry="2.5" fill="#1c1917"/>
    
    <!-- Eyes -->
    <circle cx="32" cy="30" r="3" fill="#0284c7"/>
    <circle cx="33" cy="29" r="1" fill="#ffffff"/>
    
    <!-- Fur Cheeks / Mask -->
    <path d="M20 36 C24 42 30 46 38 46 C34 50 26 50 20 46 Z" fill="#fef3c7"/>
  </g>
  <!-- Protective Collar -->
  <path d="M16 50 C24 54 36 54 44 50 L42 56 C34 60 26 60 18 56 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <circle cx="30" cy="56" r="2.5" fill="#f59e0b"/>
</svg>
