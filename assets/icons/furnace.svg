  <rect x="18" y="8" width="28" height="5" fill="#475569" stroke="#0f172a" stroke-width="1.5" rx="1"/>
  <!-- Stone Masonry Cuts -->
  <path d="M22 20 L42 20 M18 32 L46 32 M20 44 L44 44" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Arched Hearth Opening -->
  <path d="M24 58 L24 40 C24 35 40 35 40 40 L40 58 Z" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Blazing Smelting Coals -->
  <path d="M26 56 C26 44 38 44 38 56 Z" fill="url(#furnaceFire)" filter="url(#furnaceGlow)"/>
  <!-- Molten Drops / Heat -->
  <circle cx="32" cy="46" r="2.5" fill="#fef08a"/>
</svg>
