<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="meatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ea580c" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Bone Shank -->
  <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <ellipse cx="14" cy="50" rx="4" ry="4"/>
    <ellipse cx="18" cy="54" rx="4" ry="4"/>
    <rect x="14" y="40" width="10" height="12" rx="2" transform="rotate(-45 19 46)"/>
  </g>
  <!-- Meat Roast Ham -->
  <path d="M22 42 C16 34 18 20 28 14 C38 8 52 14 56 26 C60 38 48 50 36 50 C28 50 24 46 22 42 Z" fill="url(#meatGrad)" filter="url(#meatGlow)" stroke="#7c2d12" stroke-width="1.5"/>
  <!-- Bone Cross Section -->
  <ellipse cx="46" cy="24" rx="5" ry="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" transform="rotate(30 46 24)"/>
  <ellipse cx="46" cy="24" rx="2.5" ry="3.5" fill="#f87171" transform="rotate(30 46 24)"/>
  <!-- Highlight -->
  <path d="M26 22 C30 16 40 14 46 16" fill="none" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round"/>
</svg>
