<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="boneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Bone Diagonal Silhouette -->
  <g filter="url(#boneGlow)" fill="url(#boneGrad)" stroke="#94a3b8" stroke-width="1.5">
    <!-- Top-Right Condyles -->
    <circle cx="48" cy="16" r="6"/>
    <circle cx="52" cy="22" r="6"/>
    <!-- Bottom-Left Condyles -->
    <circle cx="12" cy="48" r="6"/>
    <circle cx="16" cy="54" r="6"/>
    <!-- Central Shaft -->
    <polygon points="14,46 20,52 50,22 44,16"/>
  </g>
  <!-- Highlight Ridge -->
  <line x1="20" y1="46" x2="44" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
