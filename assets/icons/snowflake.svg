<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#iceGlow)" stroke="url(#frostGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Vertical and Horizontal Main Axes -->
    <line x1="32" y1="6" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="58" y2="32"/>
    <!-- Diagonal Axes -->
    <line x1="13.6" y1="13.6" x2="50.4" y2="50.4"/>
    <line x1="50.4" y1="13.6" x2="13.6" y2="50.4"/>
    <!-- Ice Branch Prongs -->
    <!-- Top & Bottom -->
    <path d="M26 14 L32 20 L38 14"/>
    <path d="M26 50 L32 44 L38 50"/>
    <!-- Left & Right -->
    <path d="M14 26 L20 32 L14 38"/>
    <path d="M50 26 L44 32 L50 38"/>
    <!-- Diagonals branches -->
    <path d="M18 22 L23.5 23.5 L22 18"/>
    <path d="M46 42 L40.5 40.5 L42 46"/>
    <path d="M42 18 L40.5 23.5 L46 22"/>
    <path d="M22 46 L23.5 40.5 L18 42"/>
  </g>
  <!-- Central Crystal Core -->
  <circle cx="32" cy="32" r="4.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
</svg>
