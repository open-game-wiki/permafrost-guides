<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gunSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gunGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="gunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Handgun Slide & Barrel -->
  <path d="M12 20 L52 20 C53 20 54 21 54 22 L54 30 L46 32 L40 32 L36 34 L14 34 L12 28 Z" fill="url(#gunSteel)" filter="url(#gunGlow)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front Sight & Rear Sight -->
  <rect x="50" y="17" width="2" height="3" fill="#0f172a"/>
  <rect x="14" y="17" width="3" height="3" fill="#0f172a"/>
  <!-- Slide Serrations -->
  <g stroke="#1e293b" stroke-width="1.5">
    <line x1="18" y1="22" x2="18" y2="28"/>
    <line x1="22" y1="22" x2="22" y2="28"/>
    <line x1="26" y1="22" x2="26" y2="28"/>
  </g>
  <!-- Ejection Port -->
  <rect x="32" y="21" width="8" height="4" fill="#0f172a"/>
  <!-- Trigger Guard -->
  <path d="M28 34 C28 42 36 42 36 34" fill="none" stroke="#0f172a" stroke-width="2"/>
  <!-- Trigger -->
  <path d="M31 36 C32 38 34 38 34 35" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- Pistol Grip -->
  <path d="M14 34 L24 34 L20 54 C20 55 18 56 16 56 L10 52 C8 50 8 48 10 46 Z" fill="url(#gunGrip)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Grip Texture Checkering -->
  <line x1="12" y1="42" x2="19" y2="44" stroke="#64748b" stroke-width="1"/>
  <line x1="12" y1="46" x2="18" y2="48" stroke="#64748b" stroke-width="1"/>
</svg>
